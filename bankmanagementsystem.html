<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
    class BankAccount {
        static accountCount = 0;

        constructor(accountNo, holderName, balance) {
            this.accountNo = accountNo;
            this.holderName = holderName;
            this.balance = balance;
            BankAccount.accountCount++;
        }

        deposit(amount) {
            this.balance += amount;
            console.log(`₹${amount} deposited successfully`);
        }

        withdraw(amount) {
            if (amount > this.balance) {
                console.log("Withdrawal failed: Insufficient balance");
            } else {
                this.balance -= amount;
                console.log(`₹${amount} withdrawn successfully`);
            }
        }

        displayBalance() {
            console.log(`Account No: ${this.accountNo}`);
            console.log(`Holder Name: ${this.holderName}`);
            console.log(`Balance: ₹${this.balance}`);
            console.log("");
        }

        static bankInfo() {
            console.log("Bank Name: HDFC Bank");
            console.log("General Information: Safe and secure banking services.");
            console.log("");
        }
    }

    BankAccount.bankInfo();

    const account1 = new BankAccount(101, "harsh", 5000);
    const account2 = new BankAccount(102, "kartikey", 3000);

    console.log("Account 1:");
    account1.displayBalance();
    account1.deposit(2000);
    account1.withdraw(1000);
    account1.displayBalance();

    console.log("Account 2:");
    account2.displayBalance();
    account2.deposit(1000);
    account2.withdraw(5000);
    account2.displayBalance();
</script>
</head>
<body>
    
</body>
</html>
