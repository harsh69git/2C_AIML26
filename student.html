<script>
        class Student {
            static studentCount = 0;
            
           constructor(rollNo, name, marks) {
           this.rollNo = rollNo;
           this.name = name;
           this.marks = marks;
           Student.studentCount++;
  }
  displayresults() {
    console.log(`Roll No: ${this.rollNo}`);
    console.log(`Name: ${this.name}`);
    console.log(`Marks: ${this.marks}`);
    console.log(`results: ${this.marks >= 40 ? 'Pass' : 'Fail'}`);
    console.log("");
  }
  static showstudentCount() {
    console.log(`total students: ${Student.studentCount}`)
  }
}

  const student1 = new Student(1, "harsh", 85);
  const student2 = new Student(2, "karan", 35);
  const student3 = new Student(3, "nishith", 75);
   
  student1.displayresults();
  student2.displayresults();
  student3.displayresults();
  Student.showstudentCount();
</script>
